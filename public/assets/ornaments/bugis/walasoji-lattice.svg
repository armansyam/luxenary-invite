<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Anyaman Walasoji / Walasuji Bugis - Minimalist Geometric Diamond Lattice -->
  <g fill="none" stroke="#f5f2eb" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Border Frame with Inset -->
    <rect x="30" y="30" width="440" height="440" rx="16" stroke-width="2" opacity="0.85" />
    <rect x="45" y="45" width="410" height="410" rx="10" stroke-width="0.9" opacity="0.4" stroke-dasharray="6,4" />

    <!-- Primary Diagonal Lattice Lines (Up-Right) -->
    <line x1="50" y1="250" x2="250" y2="50" stroke-width="1.6" opacity="0.7" />
    <line x1="50" y1="350" x2="350" y2="50" stroke-width="1.6" opacity="0.7" />
    <line x1="50" y1="450" x2="450" y2="50" stroke-width="2" opacity="0.85" />
    <line x1="150" y1="450" x2="450" y2="150" stroke-width="1.6" opacity="0.7" />
    <line x1="250" y1="450" x2="450" y2="250" stroke-width="1.6" opacity="0.7" />
    <line x1="350" y1="450" x2="450" y2="350" stroke-width="1.6" opacity="0.7" />
    <line x1="50" y1="150" x2="150" y2="50" stroke-width="1.6" opacity="0.7" />

    <!-- Secondary Diagonal Lattice Lines (Down-Right) -->
    <line x1="50" y1="250" x2="250" y2="450" stroke-width="1.6" opacity="0.7" />
    <line x1="50" y1="150" x2="350" y2="450" stroke-width="1.6" opacity="0.7" />
    <line x1="50" y1="50" x2="450" y2="450" stroke-width="2" opacity="0.85" />
    <line x1="150" y1="50" x2="450" y2="350" stroke-width="1.6" opacity="0.7" />
    <line x1="250" y1="50" x2="450" y2="250" stroke-width="1.6" opacity="0.7" />
    <line x1="350" y1="50" x2="450" y2="150" stroke-width="1.6" opacity="0.7" />
    <line x1="50" y1="350" x2="150" y2="450" stroke-width="1.6" opacity="0.7" />

    <!-- Center Interlocking Diamond Emblems -->
    <path d="M 250 150 L 350 250 L 250 350 L 150 250 Z" stroke-width="1.8" opacity="0.9" />
    <circle cx="250" cy="250" r="5" fill="#f5f2eb" opacity="0.9" />
    
    <!-- Micro Binding Knots (Simpul Bambu Walasoji) -->
    <circle cx="150" cy="150" r="3.5" fill="#f5f2eb" opacity="0.6" />
    <circle cx="350" cy="150" r="3.5" fill="#f5f2eb" opacity="0.6" />
    <circle cx="150" cy="350" r="3.5" fill="#f5f2eb" opacity="0.6" />
    <circle cx="350" cy="350" r="3.5" fill="#f5f2eb" opacity="0.6" />

    <circle cx="250" cy="150" r="3" fill="#f5f2eb" opacity="0.7" />
    <circle cx="250" cy="350" r="3" fill="#f5f2eb" opacity="0.7" />
    <circle cx="150" cy="250" r="3" fill="#f5f2eb" opacity="0.7" />
    <circle cx="350" cy="250" r="3" fill="#f5f2eb" opacity="0.7" />
  </g>
</svg>
