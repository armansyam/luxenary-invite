<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Sulur Daun Parenreng (Ukiran Flora Saoraja Bugis) - Minimalist Botanical Line Art -->
  <g fill="none" stroke="#f5f2eb" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Core Lotus / Palmette Bud -->
    <path d="M 250 180 C 235 220, 235 260, 250 290 C 265 260, 265 220, 250 180 Z" stroke-width="1.8" opacity="0.9" />
    <line x1="250" y1="195" x2="250" y2="280" stroke-width="1" opacity="0.6" />
    
    <!-- Central Ring Halo -->
    <circle cx="250" cy="250" r="70" stroke-width="1.2" opacity="0.45" stroke-dasharray="6,5" />
    <circle cx="250" cy="250" r="6" fill="#f5f2eb" opacity="0.85" />

    <!-- Top & Bottom Flowering Tendrils -->
    <!-- Top Vine Arch -->
    <path d="M 250 180 C 220 120, 160 80, 100 90 C 70 95, 60 130, 85 145 C 115 160, 160 130, 180 170" stroke-width="1.8" opacity="0.8" />
    <path d="M 250 180 C 280 120, 340 80, 400 90 C 430 95, 440 130, 415 145 C 385 160, 340 130, 320 170" stroke-width="1.8" opacity="0.8" />

    <!-- Top Spiral Tendrils -->
    <path d="M 85 145 C 95 125, 120 115, 135 125" stroke-width="1.2" opacity="0.6" />
    <path d="M 415 145 C 405 125, 380 115, 365 125" stroke-width="1.2" opacity="0.6" />

    <!-- Bottom Vine Arch (Rezeki Mengalir) -->
    <path d="M 250 320 C 220 380, 160 420, 100 410 C 70 405, 60 370, 85 355 C 115 340, 160 370, 180 330" stroke-width="1.8" opacity="0.8" />
    <path d="M 250 320 C 280 380, 340 420, 400 410 C 430 405, 440 370, 415 355 C 385 340, 340 370, 320 330" stroke-width="1.8" opacity="0.8" />

    <!-- Bottom Spiral Tendrils -->
    <path d="M 85 355 C 95 375, 120 385, 135 375" stroke-width="1.2" opacity="0.6" />
    <path d="M 415 355 C 405 375, 380 385, 365 375" stroke-width="1.2" opacity="0.6" />

    <!-- Lateral Leaf Leaves (Daun Paria Menjalar) -->
    <path d="M 180 250 C 130 220, 90 230, 60 250 C 90 270, 130 280, 180 250 Z" stroke-width="1.6" opacity="0.85" />
    <line x1="80" y1="250" x2="160" y2="250" stroke-width="1" opacity="0.5" />
    <circle cx="50" cy="250" r="3.5" fill="#f5f2eb" opacity="0.75" />

    <path d="M 320 250 C 370 220, 410 230, 440 250 C 410 270, 370 280, 320 250 Z" stroke-width="1.6" opacity="0.85" />
    <line x1="420" y1="250" x2="340" y2="250" stroke-width="1" opacity="0.5" />
    <circle cx="450" cy="250" r="3.5" fill="#f5f2eb" opacity="0.75" />

    <!-- Corner Subtle Dots -->
    <circle cx="250" cy="50" r="4" fill="#f5f2eb" opacity="0.85" />
    <circle cx="250" cy="450" r="4" fill="#f5f2eb" opacity="0.85" />
  </g>
</svg>
