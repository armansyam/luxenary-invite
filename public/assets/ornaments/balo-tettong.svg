<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Balo Tettong & Balo Renni (Tenun Sutera Sengkang Bugis) - Minimalist Pinstripe & Diamond Weave -->
  <g fill="none" stroke="#f5f2eb" stroke-linecap="round" stroke-linejoin="round">
    <!-- Frame -->
    <rect x="40" y="40" width="420" height="420" rx="12" stroke-width="1.8" opacity="0.8" />

    <!-- Vertical Warp Threads (Garis Tegak Balo Tettong - Lambang Keteguhan Prinsip) -->
    <line x1="80" y1="40" x2="80" y2="460" stroke-width="1.4" opacity="0.5" />
    <line x1="120" y1="40" x2="120" y2="460" stroke-width="0.8" opacity="0.35" stroke-dasharray="8,4" />
    <line x1="160" y1="40" x2="160" y2="460" stroke-width="1.8" opacity="0.65" />
    <line x1="200" y1="40" x2="200" y2="460" stroke-width="0.8" opacity="0.35" stroke-dasharray="8,4" />
    <line x1="250" y1="40" x2="250" y2="460" stroke-width="2.2" opacity="0.85" />
    <line x1="300" y1="40" x2="300" y2="460" stroke-width="0.8" opacity="0.35" stroke-dasharray="8,4" />
    <line x1="340" y1="40" x2="340" y2="460" stroke-width="1.8" opacity="0.65" />
    <line x1="380" y1="40" x2="380" y2="460" stroke-width="0.8" opacity="0.35" stroke-dasharray="8,4" />
    <line x1="420" y1="40" x2="420" y2="460" stroke-width="1.4" opacity="0.5" />

    <!-- Horizontal Weft Bands (Balo Renni Rhythmic Bars) -->
    <line x1="40" y1="120" x2="460" y2="120" stroke-width="1" opacity="0.4" />
    <line x1="40" y1="250" x2="460" y2="250" stroke-width="1.6" opacity="0.7" />
    <line x1="40" y1="380" x2="460" y2="380" stroke-width="1" opacity="0.4" />

    <!-- Intersecting Micro Diamonds (Corak Tenun Lipa' Sabbe) -->
    <!-- Center Row -->
    <path d="M 250 230 L 270 250 L 250 270 L 230 250 Z" stroke-width="1.6" opacity="0.95" />
    <circle cx="250" cy="250" r="3" fill="#f5f2eb" opacity="0.9" />

    <path d="M 160 235 L 175 250 L 160 265 L 145 250 Z" stroke-width="1.2" opacity="0.75" />
    <path d="M 340 235 L 355 250 L 340 265 L 325 250 Z" stroke-width="1.2" opacity="0.75" />

    <!-- Top Row -->
    <path d="M 250 105 L 265 120 L 250 135 L 235 120 Z" stroke-width="1.2" opacity="0.65" />
    <path d="M 160 110 L 170 120 L 160 130 L 150 120 Z" stroke-width="1" opacity="0.5" />
    <path d="M 340 110 L 350 120 L 340 130 L 330 120 Z" stroke-width="1" opacity="0.5" />

    <!-- Bottom Row -->
    <path d="M 250 365 L 265 380 L 250 395 L 235 380 Z" stroke-width="1.2" opacity="0.65" />
    <path d="M 160 370 L 170 380 L 160 390 L 150 380 Z" stroke-width="1" opacity="0.5" />
    <path d="M 340 370 L 350 380 L 340 390 L 330 380 Z" stroke-width="1" opacity="0.5" />
  </g>
</svg>
