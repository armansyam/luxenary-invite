<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <!-- Bingkai Foto Minimalis Adat Bugis (Bone-White Collection) -->
  <g fill="none" stroke="#f5f2eb" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. BORDER UTAMA LUAR (DOUBLE HAIRLINE) -->
    <rect x="90" y="160" width="620" height="820" rx="16" stroke-width="2.2" opacity="0.9" />
    <rect x="100" y="170" width="600" height="800" rx="12" stroke-width="1" stroke-dasharray="6,4" opacity="0.45" />

    <!-- 2. BORDER JENDELA FOTO DALAM (TRANSPARAN DI TENGAH) -->
    <rect x="130" y="200" width="540" height="740" rx="10" stroke-width="1.8" opacity="0.8" />
    <rect x="136" y="206" width="528" height="728" rx="7" stroke-width="0.75" opacity="0.4" />

    <!-- 3. MAHKOTA PUNCAK TIMPA LAJA & COBO'-COBO' (APEX CROWN) -->
    <!-- Atap Bersusun Timpa Laja Saoraja -->
    <polygon points="400,45 480,160 320,160" stroke-width="2.2" opacity="0.9" />
    
    <!-- Tingkatan Timpa Laja Bertingkat (Prinsip Kasta Kehormatan Saoraja) -->
    <line x1="345" y1="135" x2="455" y2="135" stroke-width="1.4" opacity="0.6" />
    <line x1="365" y1="110" x2="435" y2="110" stroke-width="1.4" opacity="0.6" />
    <line x1="382" y1="85" x2="418" y2="85" stroke-width="1.4" opacity="0.6" />
    <line x1="400" y1="45" x2="400" y2="160" stroke-width="1.6" opacity="0.8" />

    <!-- Pucuk Rebung Cobo'-Cobo' Runcing Menjulang -->
    <path d="M 400 20 L 416 65 L 406 65 L 415 105 L 385 105 L 394 65 L 384 65 Z" stroke-width="1.6" opacity="0.95" />
    <polygon points="400,10 408,20 400,30 392,20" stroke-width="1.2" opacity="0.9" fill="#f5f2eb" />
    <circle cx="400" cy="55" r="3" fill="#f5f2eb" opacity="0.8" />
    <circle cx="400" cy="148" r="4" fill="#f5f2eb" opacity="0.9" />

    <!-- Sayap Lengkung Flora Bahu Mahkota -->
    <path d="M 280 160 Q 320 135 350 145" stroke-width="1.5" opacity="0.7" />
    <path d="M 520 160 Q 480 135 450 145" stroke-width="1.5" opacity="0.7" />
    <circle cx="280" cy="160" r="3" fill="#f5f2eb" opacity="0.7" />
    <circle cx="520" cy="160" r="3" fill="#f5f2eb" opacity="0.7" />

    <!-- 4. EMPAT SUDUT SULAPA EPPA (BELAH KETUPAT KOSMOLOGI) -->
    <!-- Sudut Kiri Atas (100, 170) -->
    <g transform="translate(100, 170)">
      <polygon points="0,-24 24,0 0,24 -24,0" stroke-width="1.8" opacity="0.85" />
      <polygon points="0,-14 14,0 0,14 -14,0" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
      <polygon points="0,-7 7,0 0,7 -7,0" stroke-width="1" opacity="0.9" fill="#f5f2eb" />
      <line x1="-24" y1="0" x2="-36" y2="0" stroke-width="1.2" opacity="0.7" />
      <line x1="0" y1="-24" x2="0" y2="-36" stroke-width="1.2" opacity="0.7" />
    </g>

    <!-- Sudut Kanan Atas (700, 170) -->
    <g transform="translate(700, 170)">
      <polygon points="0,-24 24,0 0,24 -24,0" stroke-width="1.8" opacity="0.85" />
      <polygon points="0,-14 14,0 0,14 -14,0" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
      <polygon points="0,-7 7,0 0,7 -7,0" stroke-width="1" opacity="0.9" fill="#f5f2eb" />
      <line x1="24" y1="0" x2="36" y2="0" stroke-width="1.2" opacity="0.7" />
      <line x1="0" y1="-24" x2="0" y2="-36" stroke-width="1.2" opacity="0.7" />
    </g>

    <!-- Sudut Kiri Bawah (100, 970) -->
    <g transform="translate(100, 970)">
      <polygon points="0,-24 24,0 0,24 -24,0" stroke-width="1.8" opacity="0.85" />
      <polygon points="0,-14 14,0 0,14 -14,0" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
      <polygon points="0,-7 7,0 0,7 -7,0" stroke-width="1" opacity="0.9" fill="#f5f2eb" />
      <line x1="-24" y1="0" x2="-36" y2="0" stroke-width="1.2" opacity="0.7" />
      <line x1="0" y1="24" x2="0" y2="36" stroke-width="1.2" opacity="0.7" />
    </g>

    <!-- Sudut Kanan Bawah (700, 970) -->
    <g transform="translate(700, 970)">
      <polygon points="0,-24 24,0 0,24 -24,0" stroke-width="1.8" opacity="0.85" />
      <polygon points="0,-14 14,0 0,14 -14,0" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
      <polygon points="0,-7 7,0 0,7 -7,0" stroke-width="1" opacity="0.9" fill="#f5f2eb" />
      <line x1="24" y1="0" x2="36" y2="0" stroke-width="1.2" opacity="0.7" />
      <line x1="0" y1="24" x2="0" y2="36" stroke-width="1.2" opacity="0.7" />
    </g>

    <!-- 5. KISI ANYAMAN WALASOJI PADA FRAME KANAN & KIRI -->
    <!-- Sisi Kiri (x=115) -->
    <g stroke-width="1" opacity="0.6">
      <polygon points="115,260 123,268 115,276 107,268" />
      <polygon points="115,340 123,348 115,356 107,348" />
      <polygon points="115,420 123,428 115,436 107,428" />
      <polygon points="115,500 123,508 115,516 107,508" />
      <polygon points="115,580 123,588 115,596 107,588" />
      <polygon points="115,660 123,668 115,676 107,668" />
      <polygon points="115,740 123,748 115,756 107,748" />
      <polygon points="115,820 123,828 115,836 107,828" />
      <polygon points="115,880 123,888 115,896 107,888" />

      <!-- Sisi Kanan (x=685) -->
      <polygon points="685,260 693,268 685,276 677,268" />
      <polygon points="685,340 693,348 685,356 677,348" />
      <polygon points="685,420 693,428 685,436 677,428" />
      <polygon points="685,500 693,508 685,516 677,508" />
      <polygon points="685,580 693,588 685,596 677,588" />
      <polygon points="685,660 693,668 685,676 677,668" />
      <polygon points="685,740 693,748 685,756 677,748" />
      <polygon points="685,820 693,828 685,836 677,828" />
      <polygon points="685,880 693,888 685,896 677,888" />
    </g>

    <!-- 6. ORNAMEN DASAR BAWAH (SULAPA EPPA LIONTIN) -->
    <g transform="translate(400, 975)">
      <polygon points="0,-16 16,0 0,16 -16,0" stroke-width="1.8" opacity="0.9" />
      <polygon points="0,-10 10,0 0,10 -10,0" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
      <polygon points="0,-5 5,0 0,5 -5,0" fill="#f5f2eb" opacity="0.9" />
      <!-- Liontin Bawah Menjuntai -->
      <line x1="0" y1="16" x2="0" y2="34" stroke-width="1.2" opacity="0.7" />
      <circle cx="0" cy="38" r="3" fill="#f5f2eb" opacity="0.8" />
      <!-- Garis Sayap Kiri Kanan -->
      <path d="M -16 0 Q -45 10 -75 0" stroke-width="1.2" opacity="0.6" />
      <path d="M 16 0 Q 45 10 75 0" stroke-width="1.2" opacity="0.6" />
    </g>

  </g>
</svg>
