<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Context (Bugis Midnight Emerald) -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#053024" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#02140f" stop-opacity="0.98" />
    </radialGradient>

    <!-- Envelope Body Gradient -->
    <linearGradient id="envelopeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#093d30" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#031e17" stop-opacity="0.95" />
    </linearGradient>

    <!-- Flap Gradient -->
    <linearGradient id="flapGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0c4c3b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#072a21" stop-opacity="0.9" />
    </linearGradient>

    <!-- Inside Pocket Gradient -->
    <linearGradient id="pocketInside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#010d0a" />
      <stop offset="100%" stop-color="#041a14" />
    </linearGradient>

    <!-- Gold Wax Seal Radial Gradient -->
    <radialGradient id="waxGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff1cf" />
      <stop offset="45%" stop-color="#e2c486" />
      <stop offset="85%" stop-color="#9a7638" />
      <stop offset="100%" stop-color="#694e1e" />
    </radialGradient>

    <!-- Button Gold Gradient -->
    <linearGradient id="btnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e7bc" />
      <stop offset="50%" stop-color="#deb974" />
      <stop offset="100%" stop-color="#ba9149" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowElevated" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="sealShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="700" height="560" fill="url(#bgGlow)" rx="16" />
  
  <!-- Subtle Tenun Grid Background Motif -->
  <g stroke="#f5f2eb" stroke-width="0.75" opacity="0.04">
    <line x1="100" y1="0" x2="100" y2="560" />
    <line x1="200" y1="0" x2="200" y2="560" />
    <line x1="300" y1="0" x2="300" y2="560" />
    <line x1="400" y1="0" x2="400" y2="560" />
    <line x1="500" y1="0" x2="500" y2="560" />
    <line x1="600" y1="0" x2="600" y2="560" />
    <line x1="0" y1="140" x2="700" y2="140" stroke-dasharray="6,6" />
    <line x1="0" y1="280" x2="700" y2="280" stroke-dasharray="6,6" />
    <line x1="0" y1="420" x2="700" y2="420" stroke-dasharray="6,6" />
  </g>

  <!-- =================================================================== -->
  <!-- MAIN ENVELOPE SLEEVE WITH CARD INSERT                               -->
  <!-- =================================================================== -->
  <g transform="translate(140, 60)" filter="url(#shadowElevated)">
    
    <!-- 1. ENVELOPE BACK POCKET (Lapisan Belakang) -->
    <rect x="0" y="40" width="420" height="260" rx="14" fill="url(#pocketInside)" stroke="#c5a86a" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- 2. INVITATION LETTER INSERT (Kartu Tamu yang Menyembul Keluar) -->
    <g transform="translate(25, 10)">
      <!-- Card Paper Base -->
      <rect x="0" y="0" width="370" height="190" rx="10" fill="#0c3026" stroke="#f9e7bc" stroke-width="1.2" stroke-opacity="0.45" />
      
      <!-- Inner Dashed Luxury Margin -->
      <rect x="8" y="8" width="354" height="174" rx="7" fill="none" stroke="#f9e7bc" stroke-width="0.75" stroke-dasharray="5,4" stroke-opacity="0.25" />

      <!-- Ornamen Pojok Mini (Sulapa Eppa Corner) -->
      <path d="M 16 26 L 26 16 M 354 26 L 344 16 M 16 164 L 26 174 M 354 164 L 344 174" stroke="#deb974" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

      <!-- Badge "UNDANGAN PERNIKAHAN" -->
      <text x="185" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#deb974" letter-spacing="0.24em" text-anchor="middle">WALIMATUL 'URS • RESMI</text>
      
      <!-- Micro Divider Line -->
      <line x1="135" y1="56" x2="235" y2="56" stroke="#deb974" stroke-width="0.8" opacity="0.4" />
      <polygon points="185,53 189,56 185,59 181,56" fill="#deb974" opacity="0.8" />

      <!-- Kepada Yth. -->
      <text x="185" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#c7baa0" letter-spacing="0.14em" text-anchor="middle">KEPADA YTH. TAMU UNDANGAN</text>

      <!-- Nama Tamu Undangan (Featured Focus) -->
      <text x="185" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.02em" text-anchor="middle">Bapak / Ibu / Sahabat</text>

      <!-- Subtitle Kediaman / Lokasi -->
      <text x="185" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-style="italic" fill="#a49c8d" letter-spacing="0.05em" text-anchor="middle">Di Tempat</text>
    </g>

    <!-- 3. ENVELOPE FRONT BODY (Badan Depan Kantung Amplop Berbentuk V-Cut) -->
    <!-- Kantung Depan Amplop -->
    <path d="M 0 110 L 210 200 L 420 110 L 420 286 C 420 294, 414 300, 406 300 L 14 300 C 6 300, 0 294, 0 286 Z" fill="url(#envelopeBody)" stroke="#f9e7bc" stroke-width="1" stroke-opacity="0.35" />

    <!-- Lipatan Sisi Kiri & Kanan (Crease Lines) -->
    <path d="M 0 300 L 175 185" stroke="#010e0a" stroke-width="1.8" opacity="0.7" />
    <path d="M 420 300 L 245 185" stroke="#010e0a" stroke-width="1.8" opacity="0.7" />
    <path d="M 0 300 L 175 185" stroke="#f9e7bc" stroke-width="0.75" stroke-opacity="0.2" />
    <path d="M 420 300 L 245 185" stroke="#f9e7bc" stroke-width="0.75" stroke-opacity="0.2" />

    <!-- Garis V-Notch Depan -->
    <path d="M 0 110 L 210 200 L 420 110" fill="none" stroke="#deb974" stroke-width="1.2" stroke-opacity="0.55" />

    <!-- 4. WAX SEAL MEDALLION (Stempel Lilin Emas Bertuliskan Inisial "FT") -->
    <g transform="translate(210, 200)" filter="url(#sealShadow)">
      <!-- Outer Wax Irregular Rim -->
      <circle cx="0" cy="0" r="22" fill="url(#waxGrad)" />
      <circle cx="0" cy="0" r="20.5" fill="none" stroke="#694e1e" stroke-width="0.8" opacity="0.4" />
      <circle cx="0" cy="0" r="17.5" fill="none" stroke="#fff1cf" stroke-width="0.75" stroke-opacity="0.6" stroke-dasharray="2,2" />
      
      <!-- Monogram FT -->
      <text x="0" y="6" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="700" fill="#302008" letter-spacing="0.1em" text-anchor="middle">FT</text>
    </g>

  </g>

  <!-- =================================================================== -->
  <!-- ACTION BUTTONS BELOW ENVELOPE                                       -->
  <!-- =================================================================== -->
  <g transform="translate(225, 410)">
    <!-- Tombol Buka Undangan -->
    <g cursor="pointer">
      <rect x="0" y="0" width="250" height="48" rx="24" fill="url(#btnGold)" filter="url(#sealShadow)" />
      
      <!-- Icon Surat -->
      <g transform="translate(36, 15)" stroke="#1a1408" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 1 4 L 10 10 L 19 4" />
        <rect x="0" y="1" width="20" height="15" rx="2" />
      </g>
      
      <!-- Button Text -->
      <text x="135" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1a1408" letter-spacing="0.16em" text-anchor="middle">BUKA UNDANGAN</text>
    </g>

    <!-- Tombol Kartu Akses QR (Subtle Pill) -->
    <g transform="translate(35, 62)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#010c08" fill-opacity="0.7" stroke="#f9e7bc" stroke-width="0.75" stroke-opacity="0.3" />
      <text x="90" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#e8dfce" letter-spacing="0.08em" text-anchor="middle">Kartu Akses QR</text>
    </g>
  </g>
</svg>
