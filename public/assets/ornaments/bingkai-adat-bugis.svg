<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <!-- Royal Bugis Gold Gradients -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db" />
      <stop offset="30%" stop-color="#e9c882" />
      <stop offset="70%" stop-color="#c49a45" />
      <stop offset="100%" stop-color="#8f6922" />
    </linearGradient>

    <linearGradient id="goldMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7228" />
      <stop offset="50%" stop-color="#deb974" />
      <stop offset="100%" stop-color="#fff1cf" />
    </linearGradient>

    <linearGradient id="goldDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#deb974" />
      <stop offset="50%" stop-color="#8a641f" />
      <stop offset="100%" stop-color="#543b0d" />
    </linearGradient>

    <!-- Drop Shadow Filter for Carved Relief Look -->
    <filter id="carvedShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f9e7bc" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ================================================================= -->
  <!-- GRUP BINGKAI UTAMA (TRANSPARAN DI TENGAH UNTUK TEMPAT FOTO)       -->
  <!-- ================================================================= -->
  <g filter="url(#carvedShadow)">

    <!-- 1. BORDER LUAR GANDA (DOUBLE HAIRLINE RIM) -->
    <!-- Garis Tepi Terluar -->
    <rect x="80" y="160" width="640" height="820" rx="20" fill="none" stroke="url(#goldBright)" stroke-width="2" />
    <!-- Garis Tepi Sekunder -->
    <rect x="88" y="168" width="624" height="804" rx="15" fill="none" stroke="url(#goldMid)" stroke-width="1" stroke-opacity="0.7" />

    <!-- 2. PITA ANYAMAN WALASOJI (KISI BELAH KETUPAT PADA BINGKAI) -->
    <!-- Bidang Dasar Pita Emas Lembut -->
    <path d="M 96 176 L 704 176 L 704 212 L 96 212 Z
             M 96 928 L 704 928 L 704 964 L 96 964 Z
             M 96 212 L 132 212 L 132 928 L 96 928 Z
             M 668 212 L 704 212 L 704 928 L 668 928 Z"
          fill="#1c160c" fill-opacity="0.4" stroke="none" />

    <!-- Motif Kisi Walasoji Garis Diagonal Horizontal Top -->
    <g stroke="url(#goldMid)" stroke-width="0.8" opacity="0.65">
      <!-- Kisi Atas -->
      <path d="M 140 176 L 160 212 M 160 176 L 140 212
               M 180 176 L 200 212 M 200 176 L 180 212
               M 220 176 L 240 212 M 240 176 L 220 212
               M 260 176 L 280 212 M 280 176 L 260 212
               M 300 176 L 320 212 M 320 176 L 300 212
               M 340 176 L 360 212 M 360 176 L 340 212
               M 440 176 L 460 212 M 460 176 L 440 212
               M 480 176 L 500 212 M 500 176 L 480 212
               M 520 176 L 540 212 M 540 176 L 520 212
               M 560 176 L 580 212 M 580 176 L 560 212
               M 600 176 L 620 212 M 620 176 L 600 212
               M 640 176 L 660 212 M 660 176 L 640 212" />

      <!-- Kisi Bawah -->
      <path d="M 140 928 L 160 964 M 160 928 L 140 964
               M 180 928 L 200 964 M 200 928 L 180 964
               M 220 928 L 240 964 M 240 928 L 220 964
               M 260 928 L 280 964 M 280 928 L 260 964
               M 300 928 L 320 964 M 320 928 L 300 964
               M 340 928 L 360 964 M 360 928 L 340 964
               M 440 928 L 460 964 M 460 928 L 440 964
               M 480 928 L 500 964 M 500 928 L 480 964
               M 520 928 L 540 964 M 540 928 L 520 964
               M 560 928 L 580 964 M 580 928 L 560 964
               M 600 928 L 620 964 M 620 928 L 600 964
               M 640 928 L 660 964 M 660 928 L 640 964" />
    </g>

    <!-- Deretan Belah Ketupat Sulapa Eppa Mini Sepanjang Sisi Kiri & Kanan -->
    <g fill="url(#goldBright)" stroke="#3a2507" stroke-width="0.5">
      <!-- Sisi Kiri (x = 114) -->
      <polygon points="114,260 121,268 114,276 107,268" />
      <polygon points="114,330 121,338 114,346 107,338" />
      <polygon points="114,400 121,408 114,416 107,408" />
      <polygon points="114,470 121,478 114,486 107,478" />
      <polygon points="114,540 121,548 114,556 107,548" />
      <polygon points="114,610 121,618 114,626 107,618" />
      <polygon points="114,680 121,688 114,696 107,688" />
      <polygon points="114,750 121,758 114,766 107,758" />
      <polygon points="114,820 121,828 114,836 107,828" />
      <polygon points="114,870 121,878 114,886 107,878" />

      <!-- Sisi Kanan (x = 686) -->
      <polygon points="686,260 693,268 686,276 679,268" />
      <polygon points="686,330 693,338 686,346 679,338" />
      <polygon points="686,400 693,408 686,416 679,408" />
      <polygon points="686,470 693,478 686,486 679,478" />
      <polygon points="686,540 693,548 686,556 679,548" />
      <polygon points="686,610 693,618 686,626 679,618" />
      <polygon points="686,680 693,688 686,696 679,688" />
      <polygon points="686,750 693,758 686,766 679,758" />
      <polygon points="686,820 693,828 686,836 679,828" />
      <polygon points="686,870 693,878 686,886 679,878" />
    </g>

    <!-- 3. BORDER DALAM (JENDELA FOTO) -->
    <!-- Garis Batas Dalam Jendela Foto (Area di dalamnya transparan sempurna) -->
    <rect x="132" y="212" width="536" height="716" rx="10" fill="none" stroke="url(#goldMid)" stroke-width="1.5" />
    <rect x="136" y="216" width="528" height="708" rx="8" fill="none" stroke="url(#goldBright)" stroke-width="0.75" stroke-opacity="0.6" />

    <!-- Aksen Sudut Dalam Jendela Foto (4 Siku Ornamen Minimalis) -->
    <g stroke="url(#goldBright)" stroke-width="1" fill="none">
      <!-- Kiri Atas -->
      <path d="M 144 236 L 144 224 L 156 224" />
      <circle cx="148" cy="228" r="2" fill="url(#goldBright)" />
      <!-- Kanan Atas -->
      <path d="M 656 236 L 656 224 L 644 224" />
      <circle cx="652" cy="228" r="2" fill="url(#goldBright)" />
      <!-- Kiri Bawah -->
      <path d="M 144 904 L 144 916 L 156 916" />
      <circle cx="148" cy="912" r="2" fill="url(#goldBright)" />
      <!-- Kanan Bawah -->
      <path d="M 656 904 L 656 916 L 644 916" />
      <circle cx="652" cy="912" r="2" fill="url(#goldBright)" />
    </g>

    <!-- ================================================================= -->
    <!-- 4. MAHKOTA PUNCAK (COBO'-COBO' / TIMPA LAJA SAORAJA)              -->
    <!-- ================================================================= -->
    <g id="crownTop">
      <!-- Sayap Lengkung Flora Bahu Mahkota -->
      <path d="M 280 160 Q 330 135 370 145 Q 350 120 320 125 Q 300 130 280 160 Z" fill="url(#goldDeep)" stroke="url(#goldBright)" stroke-width="0.8" />
      <path d="M 520 160 Q 470 135 430 145 Q 450 120 480 125 Q 500 130 520 160 Z" fill="url(#goldDeep)" stroke="url(#goldBright)" stroke-width="0.8" />

      <!-- Dasaran Mahkota (Sokoguru Tengah) -->
      <path d="M 330 160 L 470 160 L 450 142 L 350 142 Z" fill="url(#goldDeep)" stroke="url(#goldBright)" stroke-width="1.2" />

      <!-- Tingkat 3: Atap Timpa Laja Utama -->
      <polygon points="400,60 455,142 345,142" fill="url(#goldMid)" stroke="#2b1a03" stroke-width="1" />
      
      <!-- Garis-Garis Timpa Laja Bersusun (3 Tingkat) -->
      <line x1="365" y1="122" x2="435" y2="122" stroke="#2b1a03" stroke-width="1.2" />
      <line x1="378" y1="102" x2="422" y2="102" stroke="#2b1a03" stroke-width="1.2" />
      <line x1="390" y1="82" x2="410" y2="82" stroke="#2b1a03" stroke-width="1.2" />

      <!-- Tulang Punggung Vertikal Rebung -->
      <line x1="400" y1="55" x2="400" y2="142" stroke="#fff5db" stroke-width="1.2" />

      <!-- Pucuk Rebung Cobo'-Cobo' Menjulang ke Atas -->
      <path d="M 400 32 L 416 75 L 406 75 L 414 110 L 386 110 L 394 75 L 384 75 Z" fill="url(#goldBright)" stroke="#3a2507" stroke-width="0.8" />

      <!-- Bintang Berlian Sulapa Eppa di Puncak Paling Atas -->
      <polygon points="400,22 408,32 400,42 392,32" fill="#ffffff" stroke="url(#goldBright)" stroke-width="0.8" />
      <circle cx="400" cy="32" r="2.5" fill="#deb974" />

      <!-- Sulur Ukiran Parenreng Menjalar dari Tengah ke Kiri & Kanan -->
      <path d="M 400 135 Q 380 125 365 132 Q 355 138 348 132 Q 345 125 355 120 Q 375 120 395 130 Z" fill="url(#goldBright)" />
      <path d="M 400 135 Q 420 125 435 132 Q 445 138 452 132 Q 455 125 445 120 Q 425 120 405 130 Z" fill="url(#goldBright)" />

      <!-- Medallion Sulapa Eppa Pusat Mahkota -->
      <g transform="translate(400, 142)">
        <polygon points="0,-16 16,0 0,16 -16,0" fill="url(#goldBright)" stroke="#2b1a03" stroke-width="1" />
        <polygon points="0,-10 10,0 0,10 -10,0" fill="#2b1a03" />
        <polygon points="0,-6 6,0 0,6 -6,0" fill="#fff5db" />
      </g>
    </g>

    <!-- ================================================================= -->
    <!-- 5. EMPAT SUDUT SULAPA EPPA ROYAL MEDALLION                         -->
    <!-- ================================================================= -->
    <!-- Sudut Kiri Atas -->
    <g transform="translate(88, 168)" id="cornerTL">
      <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#goldMid)" stroke="#2b1a03" stroke-width="1.2" />
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#1f1406" />
      <polygon points="0,-8 8,0 0,8 -8,0" fill="url(#goldBright)" />
      <circle cx="0" cy="0" r="2.5" fill="#2b1a03" />
      <!-- Cakar Sulur Sudut -->
      <path d="M -12 -12 Q -24 -24 -18 -32 Q -10 -28 -8 -16 Z" fill="url(#goldBright)" />
      <path d="M -12 -12 Q -24 -24 -32 -18 Q -28 -10 -16 -8 Z" fill="url(#goldBright)" />
    </g>

    <!-- Sudut Kanan Atas -->
    <g transform="translate(712, 168)" id="cornerTR">
      <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#goldMid)" stroke="#2b1a03" stroke-width="1.2" />
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#1f1406" />
      <polygon points="0,-8 8,0 0,8 -8,0" fill="url(#goldBright)" />
      <circle cx="0" cy="0" r="2.5" fill="#2b1a03" />
      <!-- Cakar Sulur Sudut -->
      <path d="M 12 -12 Q 24 -24 18 -32 Q 10 -28 8 -16 Z" fill="url(#goldBright)" />
      <path d="M 12 -12 Q 24 -24 32 -18 Q 28 -10 16 -8 Z" fill="url(#goldBright)" />
    </g>

    <!-- Sudut Kiri Bawah -->
    <g transform="translate(88, 972)" id="cornerBL">
      <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#goldMid)" stroke="#2b1a03" stroke-width="1.2" />
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#1f1406" />
      <polygon points="0,-8 8,0 0,8 -8,0" fill="url(#goldBright)" />
      <circle cx="0" cy="0" r="2.5" fill="#2b1a03" />
      <!-- Cakar Sulur Sudut -->
      <path d="M -12 12 Q -24 24 -18 32 Q -10 28 -8 16 Z" fill="url(#goldBright)" />
      <path d="M -12 12 Q -24 24 -32 18 Q -28 10 -16 8 Z" fill="url(#goldBright)" />
    </g>

    <!-- Sudut Kanan Bawah -->
    <g transform="translate(712, 972)" id="cornerBR">
      <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#goldMid)" stroke="#2b1a03" stroke-width="1.2" />
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#1f1406" />
      <polygon points="0,-8 8,0 0,8 -8,0" fill="url(#goldBright)" />
      <circle cx="0" cy="0" r="2.5" fill="#2b1a03" />
      <!-- Cakar Sulur Sudut -->
      <path d="M 12 12 Q 24 24 18 32 Q 10 28 8 16 Z" fill="url(#goldBright)" />
      <path d="M 12 12 Q 24 24 32 18 Q 28 10 16 8 Z" fill="url(#goldBright)" />
    </g>

    <!-- ================================================================= -->
    <!-- 6. ORNAMEN DASAR BAWAH (AMBAL / LIONTIN SULAPA EPPA)              -->
    <!-- ================================================================= -->
    <g id="bottomCrest" transform="translate(400, 978)">
      <!-- Sayap Sulur Kiri & Kanan Bawah -->
      <path d="M 0 0 Q -40 10 -70 5 Q -60 -8 -40 -4 Q -20 2 0 0 Z" fill="url(#goldBright)" />
      <path d="M 0 0 Q 40 10 70 5 Q 60 -8 40 -4 Q 20 2 0 0 Z" fill="url(#goldBright)" />

      <!-- Medallion Sulapa Eppa Gantung -->
      <polygon points="0,-12 14,0 0,14 -14,0" fill="url(#goldBright)" stroke="#2b1a03" stroke-width="1" />
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#2b1a03" />
      <polygon points="0,-4 4,0 0,4 -4,0" fill="#fff5db" />
      <circle cx="0" cy="18" r="3" fill="url(#goldBright)" />
      <polygon points="0,21 3,26 0,30 -3,26" fill="url(#goldBright)" />
    </g>

  </g>
</svg>
