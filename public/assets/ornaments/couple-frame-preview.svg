<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgCanvas" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#063528" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#02140f" stop-opacity="0.98" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1cf" />
      <stop offset="35%" stop-color="#deb974" />
      <stop offset="70%" stop-color="#ba9149" />
      <stop offset="100%" stop-color="#e5cb93" />
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9e7bc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#deb974" stop-opacity="0" />
    </radialGradient>

    <!-- Photo Mockup Backgrounds -->
    <linearGradient id="photoMock1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#144b3c" />
      <stop offset="60%" stop-color="#0a2a21" />
      <stop offset="100%" stop-color="#041510" />
    </linearGradient>

    <linearGradient id="photoMock2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#164d3e" />
      <stop offset="60%" stop-color="#0b2c23" />
      <stop offset="100%" stop-color="#03140f" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadowElevated" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="glowCrown" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f9e7bc" flood-opacity="0.5" />
    </filter>

    <!-- Clip Paths for Arch & Diamond -->
    <clipPath id="archClip">
      <!-- Kubah Melengkung di Atas, Sudut Rounded di Bawah (160x210) -->
      <path d="M 0 80 C 0 35, 35 0, 80 0 C 125 0, 160 35, 160 80 L 160 200 C 160 206, 155 210, 149 210 L 11 210 C 5 210, 0 206, 0 200 Z" />
    </clipPath>

    <clipPath id="diamondClip">
      <!-- Diamond Soft Octagon Frame (170x200) -->
      <path d="M 28 0 L 142 0 C 158 0, 170 12, 170 28 L 170 172 C 170 188, 158 200, 142 200 L 28 200 C 12 200, 0 188, 0 172 L 0 28 C 0 12, 12 0, 28 0 Z" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="820" height="580" fill="url(#bgCanvas)" rx="16" />

  <!-- Tenun Grid Subtle Motif -->
  <g stroke="#f5f2eb" stroke-width="0.75" opacity="0.035">
    <line x1="120" y1="0" x2="120" y2="580" />
    <line x1="240" y1="0" x2="240" y2="580" />
    <line x1="360" y1="0" x2="360" y2="580" />
    <line x1="480" y1="0" x2="480" y2="580" />
    <line x1="600" y1="0" x2="600" y2="580" />
    <line x1="720" y1="0" x2="720" y2="580" />
    <line x1="0" y1="145" x2="820" y2="145" stroke-dasharray="6,6" />
    <line x1="0" y1="290" x2="820" y2="290" stroke-dasharray="6,6" />
    <line x1="0" y1="435" x2="820" y2="435" stroke-dasharray="6,6" />
  </g>

  <!-- Header Text -->
  <g text-anchor="middle" transform="translate(410, 48)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#deb974" letter-spacing="0.26em">EKSPLORASI BINGKAI FOTO PROFIL MEMPELAI</text>
    <text y="28" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="0.02em">Desain Ornamen Filosofis Bugis-Makassar</text>
  </g>

  <!-- =================================================================== -->
  <!-- MODEL 1 (KIRI): ROYAL BUGIS ARCHWAY (KUBAH PELAMINAN SAORAJA)        -->
  <!-- =================================================================== -->
  <g transform="translate(130, 130)">
    <!-- Halo Glow Behind -->
    <ellipse cx="80" cy="115" rx="110" ry="130" fill="url(#goldGlow)" />

    <!-- Container Frame Group with Shadow -->
    <g filter="url(#shadowElevated)">
      <!-- Outer Decorative Border Outline -->
      <path d="M -6 78 C -6 31, 31 -6, 80 -6 C 129 -6, 166 31, 166 78 L 166 204 C 166 214, 158 216, 149 216 L 11 216 C 2 216, -6 214, -6 204 Z" fill="none" stroke="#deb974" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="4,4" />

      <!-- Main Arch Frame with Image Inside -->
      <g clip-path="url(#archClip)">
        <!-- Photo Silhouette Base -->
        <rect width="160" height="210" fill="url(#photoMock1)" />
        
        <!-- Mockup Siluet Pengantin Berbusana Bugis (Saloko / Songkok) -->
        <g fill="#deb974" fill-opacity="0.18">
          <!-- Kepala / Mahkota Saloko Pengantin Wanita -->
          <circle cx="80" cy="80" r="28" />
          <path d="M 60 70 Q 80 48 100 70 Z" fill="#deb974" fill-opacity="0.35" />
          <polygon points="80,44 84,52 80,56 76,52" fill="#deb974" fill-opacity="0.5" />
          <!-- Bahu Baju Bodo -->
          <path d="M 32 125 Q 80 105 128 125 L 140 210 L 20 210 Z" />
        </g>
        
        <!-- Subtle Inner Shadow Scrim -->
        <path d="M 0 80 C 0 35, 35 0, 80 0 C 125 0, 160 35, 160 80 L 160 210 L 0 210 Z" fill="none" stroke="#000000" stroke-width="6" opacity="0.35" />
      </g>

      <!-- Main Golden Arch Border (Hairline Double Ring) -->
      <path d="M 0 80 C 0 35, 35 0, 80 0 C 125 0, 160 35, 160 80 L 160 200 C 160 206, 155 210, 149 210 L 11 210 C 5 210, 0 206, 0 200 Z" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" />
      <path d="M 4 82 C 4 40, 38 4, 80 4 C 122 4, 156 40, 156 82 L 156 198 C 156 202, 152 206, 147 206 L 13 206 C 8 206, 4 202, 4 198 Z" fill="none" stroke="#f9e7bc" stroke-width="0.75" stroke-opacity="0.5" />

      <!-- MAHKOTA PUNCAK (COBO'-COBO' / REBUNG BERSUSUN + SULAPA EPPA) -->
      <g transform="translate(80, -4)" filter="url(#glowCrown)">
        <!-- Pucuk Rebung Emas -->
        <path d="M 0 -18 L 8 -4 L 3 -4 L 6 4 L -6 4 L -3 -4 L -8 -4 Z" fill="url(#goldLinear)" stroke="#523912" stroke-width="0.6" />
        <!-- Sulapa Eppa Diamond Mini -->
        <polygon points="0,-24 4,-20 0,-16 -4,-20" fill="#fff1cf" />
        <!-- Permata Titik Pusat -->
        <circle cx="0" cy="0" r="3.5" fill="#fff1cf" />
      </g>

      <!-- AKSEN SUDUT BAWAH (SULAPA EPPA KIRI & KANAN) -->
      <g transform="translate(10, 206)">
        <polygon points="0,-5 5,0 0,5 -5,0" fill="url(#goldLinear)" />
      </g>
      <g transform="translate(150, 206)">
        <polygon points="0,-5 5,0 0,5 -5,0" fill="url(#goldLinear)" />
      </g>
    </g>

    <!-- Label Keterangan Model 1 -->
    <g text-anchor="middle" transform="translate(80, 248)">
      <text font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.04em">MODEL A: Kubah Pelaminan Saoraja</text>
      <text y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#deb974" letter-spacing="0.02em">Kubah Lengkung + Mahkota Pucuk Rebung</text>
      <text y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#a49c8d" letter-spacing="0.01em">• Ruang hiasan kepala busana adat sangat lega</text>
      <text y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#a49c8d" letter-spacing="0.01em">• Menghadirkan wibawa pelaminan istana Bugis</text>
    </g>
  </g>

  <!-- =================================================================== -->
  <!-- MODEL 2 (KANAN): SULAPA EPPA HERITAGE (BELAH KETUPAT KOSMIK)         -->
  <!-- =================================================================== -->
  <g transform="translate(530, 130)">
    <!-- Halo Glow Behind -->
    <ellipse cx="85" cy="115" rx="110" ry="130" fill="url(#goldGlow)" />

    <!-- Container Frame Group with Shadow -->
    <g filter="url(#shadowElevated)">
      <!-- Outer Dashed Decorative Margin -->
      <rect x="-6" y="-6" width="182" height="212" rx="18" fill="none" stroke="#deb974" stroke-width="0.8" stroke-opacity="0.35" stroke-dasharray="5,4" />

      <!-- Main Squircle/Diamond Cut Frame with Image Inside -->
      <g clip-path="url(#diamondClip)">
        <!-- Photo Silhouette Base -->
        <rect width="170" height="200" fill="url(#photoMock2)" />
        
        <!-- Mockup Siluet Pengantin Pria (Passapu / Jas Tutup) -->
        <g fill="#deb974" fill-opacity="0.18">
          <!-- Kepala / Songkok Passapu Bugis -->
          <circle cx="85" cy="78" r="28" />
          <path d="M 62 66 L 85 52 L 108 66 Z" fill="#deb974" fill-opacity="0.4" />
          <!-- Bahu Jas Tutup -->
          <path d="M 35 122 Q 85 108 135 122 L 148 200 L 22 200 Z" />
          <!-- Rantai Keris / Selempang Emas -->
          <path d="M 55 125 Q 85 155 115 175" stroke="#deb974" stroke-width="1.8" fill="none" stroke-opacity="0.35" />
        </g>
        
        <!-- Inner Shadow Scrim -->
        <rect width="170" height="200" rx="12" fill="none" stroke="#000000" stroke-width="6" opacity="0.35" />
      </g>

      <!-- Main Golden Border -->
      <rect x="0" y="0" width="170" height="200" rx="12" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" />
      <rect x="4" y="4" width="162" height="192" rx="9" fill="none" stroke="#f9e7bc" stroke-width="0.75" stroke-opacity="0.5" />

      <!-- ORNAMEN 4 PENJURU SULAPA EPPA (ATAS, BAWAH, KIRI, KANAN) -->
      <!-- Atas -->
      <g transform="translate(85, -2)" filter="url(#glowCrown)">
        <polygon points="0,-12 8,-2 0,8 -8,-2" fill="url(#goldLinear)" stroke="#523912" stroke-width="0.6" />
        <polygon points="0,-7 4,-2 0,3 -4,-2" fill="#fff1cf" />
      </g>
      <!-- Bawah -->
      <g transform="translate(85, 202)">
        <polygon points="0,-8 8,2 0,12 -8,2" fill="url(#goldLinear)" stroke="#523912" stroke-width="0.6" />
        <polygon points="0,-3 4,2 0,7 -4,2" fill="#fff1cf" />
      </g>
      <!-- Kiri -->
      <g transform="translate(-2, 100)">
        <polygon points="-12,0 -2,-8 8,0 -2,8" fill="url(#goldLinear)" stroke="#523912" stroke-width="0.6" />
        <polygon points="-7,0 -2,-4 3,0 -2,4" fill="#fff1cf" />
      </g>
      <!-- Kanan -->
      <g transform="translate(172, 100)">
        <polygon points="-8,0 2,-8 12,0 2,8" fill="url(#goldLinear)" stroke="#523912" stroke-width="0.6" />
        <polygon points="-3,0 2,-4 7,0 2,4" fill="#fff1cf" />
      </g>
    </g>

    <!-- Label Keterangan Model 2 -->
    <g text-anchor="middle" transform="translate(85, 248)">
      <text font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.04em">MODEL B: Sulapa Eppa Heritage</text>
      <text y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#deb974" letter-spacing="0.02em">Bingkai 4 Penjuru Angin Kosmik Bugis</text>
      <text y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#a49c8d" letter-spacing="0.01em">• Filosofi 4 pilar moral ksatria &amp; semesta</text>
      <text y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#a49c8d" letter-spacing="0.01em">• Geometri tegas, formal, dan berwibawa</text>
    </g>
  </g>

  <!-- Divider Center Vertical -->
  <line x1="410" y1="140" x2="410" y2="480" stroke="#deb974" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.3" />
  <polygon points="410,310 415,315 410,320 405,315" fill="#deb974" opacity="0.6" />
</svg>
