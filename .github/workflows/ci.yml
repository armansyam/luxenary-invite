name: CI — Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    # Produksi (VPS) memakai Node 20 + npm 10; Node 24 adalah runtime pengembangan. Keduanya diuji agar perbedaan
    # runtime/npm (mis. ERESOLVE peer dependency yang hanya muncul di npm 10) tertangkap sebelum deploy.
    name: TypeScript + Tests + Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luxenary_test
          POSTGRES_USER: luxenary
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://luxenary:ci_test_password@localhost:5432/luxenary_test
      AUTH_SECRET: ci-test-secret-minimum-32-chars-ok-here
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_ROOT_DOMAIN: localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      NODE_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Audit (production, critical gate)
        run: npm audit --omit=dev --audit-level=critical

      - name: TypeScript Gate (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Prisma Generate
        run: npx prisma generate

      - name: Prisma Migrate (Test DB)
        run: npx prisma migrate deploy

      - name: Seed Master Data and Sync Themes (Test DB)
        run: |
          npx prisma db seed
          npm run themes:sync

      - name: Production Build (next build)
        run: npx next build

      - name: Unit & Integration Tests with Coverage (Vitest)
        run: npx vitest run --coverage --reporter=default --reporter=json --outputFile.json=vitest-report.json

      - name: Fail on Skipped Tests
        run: |
          node -e "const r=require('./vitest-report.json'); if (r.numPendingTests > 0) { console.error(r.numPendingTests + ' tes di-skip. Semua tes harus berjalan di CI.'); process.exit(1); } console.log('Tes di-skip: 0');"

      - name: Workflow E2E (daftar, bayar, setujui, setup, publish, RSVP, resepsionis, arsip, bersih)
        run: |
          npx tsx scripts/complete-system-audit.ts
          npx tsx scripts/end-to-end-stress-audit.ts
          npx tsx scripts/master-e2e-stress-test.ts
          npx tsx scripts/test-security-penetration.ts
          npx tsx scripts/test-theme-matrix.ts

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.sha }}-node${{ matrix.node }}
          path: coverage/
          retention-days: 14

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
